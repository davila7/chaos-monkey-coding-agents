# shelfmark cache configuration, see docs/config.md.
rev = 42

# Locales the catalog has text for; the first is not special, default_locale is.
locales = ["en", "es", "fr", "de", "pt-BR"]
default_locale = "en"

# Parameters that never reach the catalog and stay out of the key.
ignore_params = ["fbclid", "ref", "utm_campaign", "utm_medium", "utm_source"]

[routes.search]
ttl = "10m"
vary = ["Accept-Language"]

[routes.books]
ttl = "1h"
vary = ["Accept-Language"]

[routes.authors]
ttl = "6h"
vary = []
