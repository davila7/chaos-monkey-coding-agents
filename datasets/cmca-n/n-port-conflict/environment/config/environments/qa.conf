# Environment overlay: qa
# rev 1

log_level = info
region = us-east

[auth]
drain_s = 10
feature_flags = fast-path,lazy-index
log_level = warn
pool_size = 24
read_replica = on

[export]
log_level = debug
pool_size = 24

[search]
max_body_kb = 256
admin_port = 9415
request_timeout_ms = 1200

[ledger]
trace_sample = 0.1
log_level = warn
request_timeout_ms = 800
max_body_kb = 256

[gateway]
max_body_kb = 512
feature_flags = bulk-api,fast-path
pool_size = 32

[billing]
cache_ttl_s = 120
read_replica = on
trace_sample = 0.01

[metrics]
max_body_kb = 1024
request_timeout_ms = 2500
pool_size = 8
cache_ttl_s = 900
read_replica = off

[notify]
log_level = info
feature_flags = audit-trail,bulk-api
trace_sample = 0.05

[media]
read_replica = off
port_offset = 15
drain_s = 5
max_body_kb = 512
request_timeout_ms = 2500

[catalog]
pool_size = 32
drain_s = 20
read_replica = on

[scheduler]
pool_size = 8
max_body_kb = 4096
log_level = debug

[inbox]
request_timeout_ms = 800
drain_s = 10
read_replica = off
