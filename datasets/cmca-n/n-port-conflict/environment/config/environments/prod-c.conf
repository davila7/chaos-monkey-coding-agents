# Environment overlay: prod-c
# rev 1

log_level = warn
region = eu-central

[ledger]
cache_ttl_s = 120
feature_flags = bulk-api,geo-routing
read_replica = off
drain_s = 10
log_level = info

[export]
max_body_kb = 1024
trace_sample = 0.25

[search]
drain_s = 20
trace_sample = 0.1
cache_ttl_s = 60
feature_flags = bulk-api,lazy-index

[auth]
read_replica = off
pool_size = 32

[inbox]
pool_size = 32
feature_flags = lazy-index,v2-pricing
max_body_kb = 256

[gateway]
request_timeout_ms = 4000
trace_sample = 0.1

[metrics]
cache_ttl_s = 900
enabled = false
max_body_kb = 512
pool_size = 48
read_replica = off
drain_s = 5

[catalog]
log_level = warn
max_body_kb = 512
request_timeout_ms = 2500
trace_sample = 0.05
read_replica = off

[scheduler]
cache_ttl_s = 60
admin_port = 9412
drain_s = 20

[billing]
read_replica = off
log_level = warn
trace_sample = 0.1
pool_size = 24

[media]
read_replica = off
max_body_kb = 1024
cache_ttl_s = 900
log_level = debug

[notify]
request_timeout_ms = 4000
read_replica = off
