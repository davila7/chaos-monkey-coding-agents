# Environment overlay: stage
# rev 1

log_level = info
region = us-east

[catalog]
feature_flags = audit-trail,geo-routing
pool_size = 32
trace_sample = 0.01
request_timeout_ms = 4000
cache_ttl_s = 60

[ledger]
log_level = info
max_body_kb = 4096
trace_sample = 0.01

[metrics]
read_replica = on
max_body_kb = 1024
log_level = info
cache_ttl_s = 900
trace_sample = 0.01

[auth]
read_replica = off
cache_ttl_s = 30
max_body_kb = 4096

[scheduler]
drain_s = 10
read_replica = off
max_body_kb = 256
log_level = debug
feature_flags = audit-trail,v2-pricing

[billing]
log_level = debug
feature_flags = bulk-api,fast-path
max_body_kb = 1024

[notify]
cache_ttl_s = 900
feature_flags = audit-trail,geo-routing
pool_size = 8
max_body_kb = 1024
drain_s = 30

[gateway]
log_level = info
max_body_kb = 4096

[search]
drain_s = 10
cache_ttl_s = 30

[export]
request_timeout_ms = 2500
pool_size = 8
log_level = warn
feature_flags = audit-trail,bulk-api
drain_s = 30

[media]
drain_s = 30
pool_size = 24

[inbox]
trace_sample = 0.1
feature_flags = bulk-api,fast-path
