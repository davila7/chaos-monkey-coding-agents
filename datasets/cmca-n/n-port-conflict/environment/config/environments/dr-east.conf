# Environment overlay: dr-east
# rev 1

log_level = warn
region = eu-west

[billing]
feature_flags = bulk-api,fast-path
read_replica = off
log_level = warn
request_timeout_ms = 4000

[ledger]
trace_sample = 0.05
log_level = debug
drain_s = 20
read_replica = off
cache_ttl_s = 900

[scheduler]
cache_ttl_s = 30
log_level = debug
trace_sample = 0.01
pool_size = 8
read_replica = off

[catalog]
cache_ttl_s = 120
max_body_kb = 4096
pool_size = 8
feature_flags = bulk-api,fast-path
drain_s = 10

[auth]
request_timeout_ms = 800
read_replica = on
max_body_kb = 256
pool_size = 32
cache_ttl_s = 120

[metrics]
max_body_kb = 512
trace_sample = 0.1

[search]
drain_s = 20
admin_port = 9416
read_replica = off
log_level = warn
request_timeout_ms = 1500
cache_ttl_s = 30

[media]
cache_ttl_s = 900
read_replica = off
pool_size = 16
drain_s = 5

[inbox]
read_replica = off
admin_port = 9412
feature_flags = bulk-api,lazy-index
drain_s = 5
trace_sample = 0.25

[export]
request_timeout_ms = 4000
feature_flags = bulk-api,v2-pricing
log_level = warn
read_replica = on

[gateway]
drain_s = 20
trace_sample = 0.1
max_body_kb = 256
log_level = debug

[notify]
request_timeout_ms = 1200
log_level = info
feature_flags = bulk-api,geo-routing
drain_s = 10
