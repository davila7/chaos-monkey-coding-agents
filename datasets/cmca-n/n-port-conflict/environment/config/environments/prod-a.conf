# Environment overlay: prod-a
# rev 1

log_level = info
region = us-east

[search]
read_replica = on
pool_size = 24
drain_s = 5
trace_sample = 0.05
cache_ttl_s = 120

[notify]
read_replica = off
drain_s = 20

[scheduler]
read_replica = off
trace_sample = 0.01

[metrics]
trace_sample = 0.1
log_level = info
drain_s = 5
max_body_kb = 1024
pool_size = 48

[catalog]
trace_sample = 0.1
max_body_kb = 256
drain_s = 20
request_timeout_ms = 1200
log_level = debug

[ledger]
max_body_kb = 512
admin_port = 9411
trace_sample = 0.25
feature_flags = fast-path,geo-routing
cache_ttl_s = 60

[gateway]
trace_sample = 0.1
log_level = info

[media]
request_timeout_ms = 1500
port_offset = 11
pool_size = 24
max_body_kb = 512

[inbox]
trace_sample = 0.1
pool_size = 32

[export]
max_body_kb = 512
cache_ttl_s = 300

[billing]
drain_s = 5
trace_sample = 0.01

[auth]
feature_flags = geo-routing,v2-pricing
trace_sample = 0.1
drain_s = 5
pool_size = 16
read_replica = off
