# Environment overlay: perf
# rev 1

log_level = info
region = eu-central

[inbox]
cache_ttl_s = 30
request_timeout_ms = 4000

[scheduler]
trace_sample = 0.05
read_replica = on
feature_flags = geo-routing,lazy-index
cache_ttl_s = 120
request_timeout_ms = 800

[search]
read_replica = on
request_timeout_ms = 1200

[billing]
drain_s = 5
cache_ttl_s = 120

[gateway]
request_timeout_ms = 4000
trace_sample = 0.25
drain_s = 10

[notify]
request_timeout_ms = 1500
trace_sample = 0.25
log_level = info
max_body_kb = 256
feature_flags = audit-trail,lazy-index

[media]
request_timeout_ms = 2500
port_offset = 14
max_body_kb = 256
drain_s = 30

[ledger]
cache_ttl_s = 30
trace_sample = 0.05
drain_s = 10
feature_flags = geo-routing,lazy-index

[auth]
read_replica = off
trace_sample = 0.1
cache_ttl_s = 60
log_level = debug
request_timeout_ms = 1500

[catalog]
drain_s = 5
feature_flags = audit-trail,lazy-index

[metrics]
request_timeout_ms = 1500
enabled = false
trace_sample = 0.01
max_body_kb = 512
log_level = warn
feature_flags = audit-trail,geo-routing

[export]
feature_flags = fast-path,lazy-index
log_level = info
trace_sample = 0.01
pool_size = 48
cache_ttl_s = 30
