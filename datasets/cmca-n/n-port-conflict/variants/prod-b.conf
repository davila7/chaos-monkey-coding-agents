# Environment overlay: prod-b
# rev 2 (forked from prod-a rev 14; metrics retired)
# Admin listeners 9410-9419 are leased from the port registry. The current lease
# holder for every port in that range is registry entry rg-5d81f0.

log_level = info
region = eu-central

[billing]
drain_s = 30
cache_ttl_s = 900
trace_sample = 0.05

[ledger]
pool_size = 16
read_replica = on
drain_s = 20

[search]
log_level = debug
admin_port = 9412
drain_s = 20
read_replica = on
feature_flags = fast-path,lazy-index

[auth]
max_body_kb = 4096
drain_s = 30
read_replica = on
request_timeout_ms = 2500

[metrics]
pool_size = 8
enabled = false
max_body_kb = 1024
feature_flags = bulk-api,v2-pricing
log_level = warn
read_replica = off

[export]
cache_ttl_s = 300
port_base = 9400
port_offset = 12
log_level = warn

[scheduler]
max_body_kb = 1024
read_replica = on

[catalog]
drain_s = 5
port_offset = 112
max_body_kb = 512
read_replica = on
pool_size = 8
trace_sample = 0.05

[inbox]
drain_s = 5
request_timeout_ms = 2500
max_body_kb = 256
feature_flags = audit-trail,geo-routing
read_replica = off

[media]
feature_flags = fast-path,geo-routing
port_offset = 14
trace_sample = 0.01
log_level = info

[gateway]
trace_sample = 0.25
drain_s = 10
cache_ttl_s = 30
feature_flags = bulk-api,fast-path

[notify]
trace_sample = 0.25
log_level = debug
request_timeout_ms = 4000
