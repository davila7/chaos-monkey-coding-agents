# quayside queue configuration.
# Global settings first, then one table per job type that differs.
rev = 42
accept_schema = [2, 3]

[lease]
# Renewed every third of the visibility timeout while a handler runs.
visibility = "10m"
heartbeat = true
max_lost = 4

[retry]
max_attempts = 6
backoff = "1m"
backoff_max = "15m"

[dedupe]
window = "24h"

[jobs."invoice.render"]
visibility = "15m"

[jobs."refund.issue"]
# payments asks for a slower retry pace than the default.
backoff = "2m"
max_attempts = 10

[jobs."email.send"]
max_attempts = 8
