# fx 0.0.13 accepts plain http MCP URLs only on loopback (V-07 notes, D-0027), so the
# gateway shares the agent container's network namespace and serves 127.0.0.1:8000.
# The service has no network at all: the gateway reaches it over a socket on a volume
# the agent container does not mount (V-13).
services:
  gateway:
    image: tt-gateway:0.1.0
    pull_policy: never
    network_mode: "service:main"
    environment:
      TT_UPSTREAMS: inventory=unix:/run/inventory/inventory.sock:/mcp
      TT_CONFIG: /etc/tt/s-shipment-backfill.json
      TT_ATTEMPT: ${TT_ATTEMPT:-0}
    volumes:
      - ${TT_CONFIG_DIR:-./inventory/none}:/etc/tt:ro
      - inventory-socket:/run/inventory
    depends_on:
      inventory-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/').then(()=>process.exit(0),()=>process.exit(1))"]
      interval: 1s
      retries: 30
  inventory-backend:
    image: tt-inventory:0.1.0
    pull_policy: never
    network_mode: none
    environment:
      INVENTORY_SOCKET: /run/inventory/inventory.sock
    volumes:
      - ./inventory/fixture.json:/srv/inventory/fixture.json:ro
      - inventory-socket:/run/inventory
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(require('fs').statSync('/run/inventory/inventory.sock').isSocket()?0:1)"]
      interval: 1s
      retries: 30
volumes:
  inventory-socket: {}
