# fx 0.0.13 accepts plain http MCP URLs only on loopback (V-07 notes, D-0027), so the
# gateway shares the agent container's network namespace and serves 127.0.0.1:8000.
# The services have no network at all: the gateway reaches them over sockets on volumes
# the agent container does not mount (V-13).
services:
  gateway:
    image: tt-gateway:0.1.0
    pull_policy: never
    network_mode: "service:main"
    environment:
      TT_UPSTREAMS: tickets=unix:/run/tickets/tickets.sock:/mcp,deploy=unix:/run/deploy/deploy.sock:/mcp,docs=unix:/run/docs/docs.sock:/mcp
      TT_CONFIG: /etc/tt/s-change-release.json
      TT_ATTEMPT: ${TT_ATTEMPT:-0}
    volumes:
      - ${TT_CONFIG_DIR:-./tickets/none}:/etc/tt:ro
      - tickets-socket:/run/tickets
      - deploy-socket:/run/deploy
      - docs-socket:/run/docs
    depends_on:
      tickets-backend:
        condition: service_healthy
      deploy-backend:
        condition: service_healthy
      docs-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/').then(()=>process.exit(0),()=>process.exit(1))"]
      interval: 1s
      retries: 30
  tickets-backend:
    image: tt-tickets:0.1.0
    pull_policy: never
    network_mode: none
    environment:
      TICKETS_SOCKET: /run/tickets/tickets.sock
    volumes:
      - ./tickets/fixture.json:/srv/tickets/fixture.json:ro
      - tickets-socket:/run/tickets
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(require('fs').statSync('/run/tickets/tickets.sock').isSocket()?0:1)"]
      interval: 1s
      retries: 30
  deploy-backend:
    image: tt-deploy:0.1.0
    pull_policy: never
    network_mode: none
    environment:
      DEPLOY_SOCKET: /run/deploy/deploy.sock
    volumes:
      - ./deploy/fixture.json:/srv/deploy/fixture.json:ro
      - deploy-socket:/run/deploy
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(require('fs').statSync('/run/deploy/deploy.sock').isSocket()?0:1)"]
      interval: 1s
      retries: 30
  docs-backend:
    image: tt-docs:0.1.0
    pull_policy: never
    network_mode: none
    environment:
      DOCS_SOCKET: /run/docs/docs.sock
    volumes:
      - ./docs/fixture.json:/srv/docs/fixture.json:ro
      - docs-socket:/run/docs
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(require('fs').statSync('/run/docs/docs.sock').isSocket()?0:1)"]
      interval: 1s
      retries: 30
volumes:
  tickets-socket: {}
  deploy-socket: {}
  docs-socket: {}
