# The probe-s-read topology (datasets/conformance-s/probe-s-read/environment) with
# a long-running agent container. AGENT_IMAGE is the task image plus the sandbox CA;
# W is a directory holding emit.py output, check.sh and fake-model.mjs.
services:
  main:
    image: ${AGENT_IMAGE}
    command: ["sleep", "infinity"]
    volumes:
      - ${W}:/w
  gateway:
    image: tt-gateway:0.1.0
    pull_policy: never
    network_mode: "service:main"
    environment:
      TT_UPSTREAMS: tickets=unix:/run/tickets/tickets.sock:/mcp
      TT_CONFIG: /etc/tt/probe-s-read.json
      TT_ATTEMPT: 0
    volumes:
      - ../../../datasets/conformance-s/probe-s-read/environment/tickets/none:/etc/tt:ro
      - tickets-socket:/run/tickets
    depends_on:
      tickets-backend:
        condition: service_healthy
  tickets-backend:
    image: tt-tickets:0.1.0
    pull_policy: never
    network_mode: none
    environment:
      TICKETS_SOCKET: /run/tickets/tickets.sock
    volumes:
      - ../../../datasets/conformance-s/probe-s-read/environment/tickets/fixture.json:/srv/tickets/fixture.json:ro
      - tickets-socket:/run/tickets
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(require('fs').statSync('/run/tickets/tickets.sock').isSocket()?0:1)"]
      interval: 1s
      retries: 30
volumes:
  tickets-socket: {}
