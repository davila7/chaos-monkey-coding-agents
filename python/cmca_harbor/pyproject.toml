[project]
name = "cmca-harbor"
version = "0.1.0"
description = "Harbor custom agents that run harnesses with the CMCA injectors"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["harbor==0.24.0"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmca_harbor"]
