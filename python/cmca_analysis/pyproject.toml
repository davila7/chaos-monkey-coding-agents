[project]
name = "cmca-analysis"
version = "0.1.0"
description = "Analysis pipeline: validation, reconciliation, classification, metrics"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmca_analysis"]
