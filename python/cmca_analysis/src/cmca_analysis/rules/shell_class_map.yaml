# Shell commands that achieve a built-in tool's capability class (SPEC 11.1 rule 4).
# Each pattern is a Python regular expression matched against every segment of a
# shell command split on `|`, `;`, `&&` and `||`. First match wins.
schema: cmca-shell-class-map/1
version: 1
classes:
  fs.read:
    - '^\s*(sudo\s+)?(cat|head|tail|less|more|sed\s+-n|nl|od|xxd|hexdump|strings|file)\b'
    - '^\s*(python3?|node)\b.*\b(open|read_text|readFileSync|read)\b'
  fs.search:
    - '^\s*(sudo\s+)?(grep|egrep|fgrep|rg|ag|ack|git\s+grep)\b'
  fs.list:
    - '^\s*(sudo\s+)?(ls|find|tree|du|stat|fd|git\s+ls-files)\b'
  fs.write:
    - '^\s*(sudo\s+)?(tee|touch|cp|mv|install)\b'
    - '(^|\s)>{1,2}\s*[^&\s]'
  fs.edit:
    - '^\s*(sudo\s+)?(sed\s+-i|perl\s+-pi|patch|ed)\b'
