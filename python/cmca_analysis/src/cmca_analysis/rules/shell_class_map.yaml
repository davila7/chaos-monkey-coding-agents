# Shell commands that achieve a built-in tool's capability class (SPEC 11.1 rules 3 and 4),
# and the program a shell command runs when it achieves none (rule 3, D-0033).
# Each pattern is a Python regular expression matched against every segment of a
# shell command split on `|`, `;`, `&&` and `||`. First match wins.
schema: cmca-shell-class-map/1
version: 2
classes:
  fs.read:
    - '^\s*(sudo\s+)?(cat|head|tail|less|more|sed\s+-n|nl|od|xxd|hexdump|strings|file)\b'
    - '^\s*(python3?|node)\b.*\b(open|read_text|readFileSync|read)\b'
  fs.search:
    - '^\s*(sudo\s+)?(grep|egrep|fgrep|rg|ag|ack|git\s+grep)\b'
  fs.list:
    - '^\s*(sudo\s+)?(ls|find|tree|du|stat|fd|git\s+ls-files)\b'
  fs.write:
    - '^\s*(sudo\s+)?(tee|touch|cp|mv|install)\b'
    - '(^|\s)>{1,2}\s*[^&\s]'
  fs.edit:
    - '^\s*(sudo\s+)?(sed\s+-i|perl\s+-pi|patch|ed)\b'
# A command's program: the first token of its lead segment (the first segment,
# heredoc bodies removed, that no skip pattern matches), after wrappers. For an
# interpreter the program also takes the script, the module after -m, `-c`, or
# `-` for stdin, so `python3 -m pytest` and `python3 build.py` differ.
program:
  skip_segments:
    - '^\s*(cd|pushd|popd|export|set|source|\.)(\s|$)'
    - '^\s*(for|while|until|if|case)\s'
    - '^\s*(done|fi|esac)\s*$'
    - '^\s*sleep\s'
  wrappers: [do, then, else, sudo, env, timeout, nice, nohup, time, command, exec, xargs, npx, uv run, pnpm exec, poetry run]
  interpreters: [python, python3, node, bash, sh, zsh, ruby, perl, deno, bun, uv, npm, pnpm, yarn, go, cargo, make, java]
