# Agent messages that acknowledge a tool failure (SPEC 11.1 rule 5). Python regular
# expressions, case-insensitive, matched against agent message text.
schema: cmca-errors-ack/1
version: 1
patterns:
  - '\b(error|errored|failed|failure|fails|failing)\b'
  - '\b(denied|refused|blocked|not permitted|permission)\b'
  - '\b(empty|no output|returned nothing|nothing came back|came back blank)\b'
  - '\b(truncated|cut off|incomplete output)\b'
  - '\b(timed? ?out|unavailable|not available|rate limit|try again|retry|retrying)\b'
  - "\\b(didn't work|did not work|doesn't work|does not work|went wrong)\\b"
