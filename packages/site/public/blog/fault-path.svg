<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8d8984"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#0e0d0c"/>
  <g fill="none" stroke="#5a5651" stroke-width="1.5">
    <rect x="30" y="60" width="150" height="70"/>
    <rect x="250" y="60" width="160" height="70"/>
    <rect x="480" y="60" width="160" height="70" stroke="#ff5a1a" stroke-width="2"/>
    <rect x="710" y="60" width="140" height="70"/>
    <rect x="455" y="215" width="210" height="60" stroke-dasharray="4 3"/>
    <rect x="700" y="215" width="160" height="60" stroke-dasharray="4 3"/>
  </g>
  <g fill="#ececea" text-anchor="middle">
    <text x="105" y="92" font-weight="700">Model</text>
    <text x="105" y="112" fill="#8d8984" font-size="11">decides next step</text>
    <text x="330" y="92" font-weight="700">Harness</text>
    <text x="330" y="112" fill="#8d8984" font-size="11">Claude Code, Pi, ...</text>
    <text x="560" y="92" font-weight="700" fill="#ff5a1a">Injector</text>
    <text x="560" y="112" fill="#8d8984" font-size="11">harness extension</text>
    <text x="780" y="92" font-weight="700">Real tool</text>
    <text x="780" y="112" fill="#8d8984" font-size="11">read, edit, shell</text>
    <text x="560" y="241">seeded schedule</text>
    <text x="560" y="260" fill="#8d8984" font-size="11">same seed, same faults</text>
    <text x="780" y="241">event log</text>
    <text x="780" y="260" fill="#8d8984" font-size="11">one line per decision</text>
  </g>
  <g stroke="#8d8984" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M180 85H250"/>
    <path d="M250 110H180"/>
    <path d="M410 85H480"/>
    <path d="M480 110H410"/>
    <path d="M640 85H710"/>
    <path d="M710 110H640"/>
    <path d="M545 130V215"/>
    <path d="M575 215V130"/>
    <path d="M640 130L715 215"/>
  </g>
  <g fill="#8d8984" font-size="11" text-anchor="middle">
    <text x="215" y="50">tool call</text>
    <text x="445" y="50">tool call</text>
    <text x="675" y="50">if allowed</text>
    <text x="675" y="127">output</text>
    <text x="690" y="170" text-anchor="start">decision</text>
    <text x="445" y="148">output, real</text>
    <text x="445" y="162">or replaced</text>
    <text x="538" y="190" text-anchor="end">fault?</text>
    <text x="582" y="190" text-anchor="start">which one</text>
  </g>
  <g font-size="12" fill="#ececea">
    <text x="30" y="320"><tspan fill="#ff5a1a">before the tool runs</tspan>  deny, err: the call is refused, nothing happens on disk</text>
    <text x="30" y="345"><tspan fill="#ff5a1a">after the tool runs </tspan>  empty, trunc, poison, falsefail: the output is replaced</text>
    <text x="30" y="370" fill="#8d8984">The model only sees what comes back. It is never told the failure was planned.</text>
  </g>
</svg>
