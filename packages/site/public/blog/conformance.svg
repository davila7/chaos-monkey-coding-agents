<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8d8984"/>
    </marker>
  </defs>
  <rect width="880" height="380" fill="#0e0d0c"/>
  <g fill="none" stroke="#5a5651" stroke-width="1.5">
    <rect x="30" y="40" width="190" height="80"/>
    <rect x="270" y="40" width="190" height="80"/>
    <rect x="510" y="40" width="340" height="80" stroke="#ff5a1a" stroke-width="2"/>
    <rect x="510" y="200" width="160" height="70"/>
    <rect x="690" y="200" width="160" height="70"/>
  </g>
  <g fill="#ececea" text-anchor="middle">
    <text x="125" y="70" font-weight="700">Probe task</text>
    <text x="125" y="90" fill="#8d8984" font-size="11">one targeted call,</text>
    <text x="125" y="105" fill="#8d8984" font-size="11">e.g. read a file</text>
    <text x="365" y="70" font-weight="700">Force one fault</text>
    <text x="365" y="90" fill="#8d8984" font-size="11">first eligible call,</text>
    <text x="365" y="105" fill="#8d8984" font-size="11">one type, one tool</text>
    <text x="680" y="68" font-weight="700" fill="#ff5a1a">Run 3 times, check each run</text>
    <text x="680" y="90" font-size="12">1. the injector logged the decision</text>
    <text x="680" y="108" font-size="12">2. the payload is in what the model saw</text>
    <text x="590" y="230" font-weight="700">all 3 pass</text>
    <text x="590" y="250" fill="#8d8984" font-size="11">type can be used</text>
    <text x="770" y="230" font-weight="700">any run fails</text>
    <text x="770" y="250" fill="#8d8984" font-size="11">gap, not scheduled*</text>
  </g>
  <g stroke="#8d8984" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M220 80H270"/>
    <path d="M460 80H510"/>
    <path d="M620 120L595 200"/>
    <path d="M740 120L765 200"/>
  </g>
  <g font-size="12" fill="#8d8984">
    <text x="30" y="200">Not checked in this first batch:</text>
    <text x="30" y="222">3. attribution added by the harness</text>
    <text x="30" y="242">4. side effects (did the file change?)</text>
    <text x="30" y="262">5. injector latency</text>
    <text x="30" y="282">6. behavior when the injector crashes</text>
    <text x="30" y="340" fill="#ececea">Output: one capability file per harness version. Boards compare</text>
    <text x="30" y="360" fill="#ececea">harnesses only on fault types every one of them receives.</text>
    <text x="690" y="292" font-size="11">* proposed in D-0017</text>
  </g>
</svg>
