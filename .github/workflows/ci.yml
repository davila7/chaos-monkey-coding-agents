name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Generated JSON Schemas are committed
        run: git diff --exit-code -- packages/fault-engine/schemas
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - name: Changed tasks bump their version
        if: github.event_name == 'pull_request'
        run: node packages/cli/dist/bin.js task-bump --base origin/${{ github.base_ref }} --root .
      - name: tt-decide p95 latency under 150 ms
        run: pnpm bench:decide

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --locked
      - run: uv run pytest
