name: paper

# D-0050 item 3: the paper compiles from generated numbers, with no undefined macro or reference.
on:
  pull_request:
    paths:
      - paper/**
      - python/cmca_analysis/**
      - results/**
      - .github/workflows/paper.yml
  push:
    branches: [main]
    paths:
      - paper/**
      - python/cmca_analysis/**
      - results/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages --locked
      - name: TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-pictures lmodern latexmk
      - run: paper/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: |
            paper/main.pdf
            paper/arxiv.tar.gz
