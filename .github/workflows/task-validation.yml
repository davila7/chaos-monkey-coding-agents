name: task-validation

# SPEC 10.4 items 3 to 5 for the tasks a pull request changes: oracle under clean, nop,
# and on Track S the oracle under every fault profile. No model is called.
on:
  pull_request:
    paths:
      - datasets/cmca-*/**
      - packages/fault-engine/**
      - packages/mcp-fault-proxy/**
      - packages/mock-services/**
      - profiles/**
      - python/cmca_harbor/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --locked
      - name: Service images
        run: scripts/service-images.sh
      - name: Validate changed tasks
        run: |
          base=origin/${{ github.base_ref }}
          out=task-validation
          status=0
          # A change to the gateway, services, engine or profiles affects every Track S task.
          if git diff --name-only "$base...HEAD" | grep -qE '^(packages/(fault-engine|mcp-fault-proxy|mock-services)|profiles)/'; then
            s_args=()
          else
            s_args=(--changed-since "$base")
          fi
          uv run python -m cmca_harbor.validate --dataset datasets/cmca-s "${s_args[@]}" --out "$out/cmca-s" || status=1
          uv run python -m cmca_harbor.validate --dataset datasets/cmca-n --changed-since "$base" --out "$out/cmca-n" || status=1
          exit $status
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-validation
          path: task-validation
          if-no-files-found: ignore
