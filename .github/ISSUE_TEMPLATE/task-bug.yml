name: Task bug
description: A task that is unsolvable, solvable without doing the work, or graded wrongly.
title: "Task bug: <task id>"
labels: ["task-bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security or safety findings (credential exposure, destructive behavior, data loss) follow a private route (SPEC 15.3). Do not report them in a public issue.
  - type: input
    id: task
    attributes:
      label: Task id
      description: The directory name under datasets/, for example n-ledger-fix.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Task version
      description: The version in the task's task.toml.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: What happens and how to reproduce it, with trial ids, log excerpts or the verifier output.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
    validations:
      required: false
