name: Harness request
description: Propose a coding-agent harness for the benchmark.
title: "Harness: <name> <version>"
labels: ["harness"]
body:
  - type: markdown
    attributes:
      value: |
        A harness joins the boards only after it passes conformance (SPEC 9.6). CONTRIBUTING.md lists the steps.
  - type: input
    id: harness
    attributes:
      label: Harness and pinned version
      description: For example, opencode 1.18.35. Use a stable release at least 7 days old.
    validations:
      required: true
  - type: textarea
    id: hooks
    attributes:
      label: Interception point for built-in tools
      description: Link the official documentation of the hook, plugin or extension API that can replace a tool result before the model sees it (Track N). Write "none" if it has none; it can still join Track S.
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: Model access
      description: How the harness reaches `claude-sonnet-5-5` (direct API, gateway, bridge), and its terms on automated use and publication of benchmark results.
    validations:
      required: true
