schema: tt-config/1
id: fx-claude
harness:
  name: fx
  version: "0.0.13"
  # Harbor's fx agent with a checksum-pinned install and session collection (D-0027).
  harbor_agent: "cmca_harbor:ChaosFx"
model:
  # The cc-claude model (claude-sonnet-5-5) under its AI Gateway id.
  id: "anthropic/claude-sonnet-5.5"
  # ChaosFx pins the gateway to the provider in the model id (FX_PROVIDER_ORDER and
  # FX_PROVIDER_STRICT), so a failed request is not retried on Bedrock or Vertex (V-08).
  route: vercel-ai-gateway
  reasoning: "<setting>"
autonomy:
  mode: full
  native_setting: "fx ask --yolo (alias of --full-access; Harbor's default permission_mode)"
axes: [fixed]
tracks: [s]
limits:
  wall_clock_minutes: 30
  max_turns: "<equivalent high value>"
