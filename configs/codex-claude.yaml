schema: tt-config/1
id: codex-claude
harness:
  name: codex
  # Newest stable release at least 7 days old on 2026-10-30 (D-0044 item 1).
  version: "0.163.0"
  # Codex with packages/responses-bridge in the agent container, which turns its
  # Responses API calls into Messages API calls (D-0044 item 2, V-28).
  harbor_agent: "cmca_harbor:ChaosCodex"
model:
  id: "claude-sonnet-5-5"
  route: anthropic-api
  # Same as cc-claude: adaptive thinking, effort medium, set by the bridge from Codex's reasoning effort.
  reasoning: "medium"
autonomy:
  mode: full
  native_setting: "codex exec --dangerously-bypass-approvals-and-sandbox (Harbor's default), --dangerously-bypass-hook-trust for Track N (V-03)"
axes: [fixed]
tracks: [s, n]
limits:
  wall_clock_minutes: 30
  max_turns: "<equivalent high value>"
