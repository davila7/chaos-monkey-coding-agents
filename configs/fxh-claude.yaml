schema: tt-config/1
id: fxh-claude
harness:
  name: fxh
  # fxh: fork of fx 0.0.13 with commands before and after each built-in tool call (D-0040).
  version: "0.0.13-h1"
  # ChaosFx with the fork's binary pinned by checksum and the injector registered in ~/.fx/settings.json.
  harbor_agent: "cmca_harbor:ChaosFxh"
model:
  # Same model, route and reasoning as fx-claude.
  id: "anthropic/claude-sonnet-5.5"
  route: vercel-ai-gateway
  reasoning: "medium"
autonomy:
  mode: full
  native_setting: "fx ask --yolo (alias of --full-access; Harbor's default permission_mode)"
axes: [fixed]
tracks: [n]
limits:
  wall_clock_minutes: 30
  max_turns: "<equivalent high value>"
