schema: tt-config/1
id: pi-claude
harness:
  name: pi
  version: "1.0.3"
  harbor_agent: "cmca_harbor:ChaosPi"
model:
  # The cc-claude model; Harbor's Pi agent takes it as anthropic/claude-sonnet-5-5.
  id: "claude-sonnet-5-5"
  route: anthropic-api
  # Passed as reasoning_effort, which Harbor's Pi agent sends as `pi --thinking medium`.
  reasoning: "medium"
autonomy:
  mode: full
  # MCP tools use exposure "direct", not Pi's default codemode, so the model calls them as declared tools (D-0038 item 1).
  native_setting: "pi --print; Pi 1.0.3 asks no approval before tool calls (docs/security.md)"
axes: [fixed]
tracks: [s, n]
limits:
  wall_clock_minutes: 30
  max_turns: "<equivalent high value>"
