schema: tt-config/1
id: muse-spark
harness:
  name: muse
  # Muse Code stable channel on 2026-10-31, pinned by version and sha256 from Meta's manifest, auto-update off (D-0047 item 1, V-29).
  version: "1.4.14-R7309.1"
  # Harbor's muse-code agent with the pinned binary, `--provider meta --contributor-mode off`, and the injector in the user settings for Track N.
  harbor_agent: "cmca_harbor:ChaosMuse"
model:
  # Meta's recommended model on 2026-10-31 (https://dev.meta.ai/docs/models), through Meta's own API in Standard mode.
  id: "meta/muse-spark-1.3"
  route: meta-api
  # Muse Code's default reasoning effort.
  reasoning: "high"
autonomy:
  mode: full
  native_setting: "muse exec --json --yolo --user-input-auto-resolve (Harbor's default)"
axes: [native]
tracks: [s, n]
limits:
  wall_clock_minutes: 30
  max_turns: "<equivalent high value>"
