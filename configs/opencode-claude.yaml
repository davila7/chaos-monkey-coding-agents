schema: tt-config/1
id: opencode-claude
harness:
  name: opencode
  version: "1.18.35"
  harbor_agent: "cmca_harbor:ChaosOpenCode"
model:
  # The cc-claude model; Harbor's OpenCode agent takes it as anthropic/claude-sonnet-5-5.
  id: "claude-sonnet-5-5"
  route: anthropic-api
  # Passed as `opencode run --variant medium`; OpenCode 1.18.35 lists the variant as adaptive thinking with effort medium (V-25).
  reasoning: "medium"
autonomy:
  mode: full
  native_setting: "opencode run --dangerously-skip-permissions (Harbor's run command)"
axes: [fixed]
tracks: [s, n]
limits:
  wall_clock_minutes: 30
  max_turns: "<equivalent high value>"
